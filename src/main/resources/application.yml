spring:
  application:
    name: food-plant-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodplant}
    username: ${DB_USER:foodplant}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    type: ${CACHE_TYPE:redis}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-password: ${ADMIN_PASSWORD:}
    staff-password: ${STAFF_PASSWORD:}
    viewer-password: ${VIEWER_PASSWORD:}
  rate-limit:
    per-minute: ${RATE_LIMIT_PER_MINUTE:15000}
    login-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:30}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  structured:
    format:
      console: logstash
