services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodplant
      POSTGRES_USER: foodplant
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodplant -d foodplant"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [private]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [private]
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://db:5432/foodplant
      DB_USER: foodplant
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?Set STAFF_PASSWORD in .env}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?Set VIEWER_PASSWORD in .env}
      CACHE_TYPE: redis
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-15000}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-30}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [private]
    security_opt: ["no-new-privileges:true"]
  maven-test:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - maven_cache:/root/.m2
    command: ["mvn", "-B", "-ntp", "clean", "verify"]
    networks: [private]
  k6:
    image: grafana/k6:0.54.0
    profiles: [loadtest]
    environment:
      BASE_URL: http://api:8080
      LOGIN_EMAIL: viewer@foodplant.local
      LOGIN_PASSWORD: ${VIEWER_PASSWORD:?Set VIEWER_PASSWORD in .env}
    working_dir: /scripts
    volumes:
      - ./loadtest:/scripts:ro
      - ./verification:/results
    entrypoint: ["k6"]
    command: ["run", "--summary-export=/results/k6.json", "/scripts/festival-ramp.js"]
    depends_on:
      api: {condition: service_started}
    networks: [private]
networks:
  private:
volumes:
  postgres_data:
  redis_data:
  maven_cache:
