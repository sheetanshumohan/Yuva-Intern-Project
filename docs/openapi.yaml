openapi: 3.0.3
info:
  title: Food Plant Traceability & Inventory REST API
  version: 1.0.0
  description: Fictional Kochi spice processing unit. All weights normalized to kg;
    batchNumber is reusable, UUID is stable identifier.
servers:
- url: http://localhost:8080
  description: Local Docker Compose
tags:
- name: Authentication
- name: Suppliers
- name: Production Lines
- name: Raw Materials
- name: Batches
- name: Quality
- name: Traceability
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Authentication
      summary: Exchange credentials for signed JWT
      description: No JWT required.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: JWT missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Sanitized unexpected error (no stack traces)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/users:
    post:
      operationId: createUser
      tags:
      - Authentication
      summary: Provision a new user (admin)
      description: 'Required role: ADMIN (ADMIN also has write privileges).'
      responses:
        '201':
          description: Successful operation
