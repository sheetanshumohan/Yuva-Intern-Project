components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WeightInput:
      type: object
      required:
      - value
      - unit
      properties:
        value:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          enum:
          - KG
          - G
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresInSeconds:
          type: integer
        role:
          type: string
    UserRequest:
      type: object
      required:
      - email
      - password
      - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        role:
          type: string
          enum:
          - ADMIN
          - STAFF
          - VIEWER
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        enabled:
          type: boolean
    SupplierRequest:
      type: object
      required:
      - name
      - contactEmail
      - originRegion
      - active
      properties:
        name:
          type: string
        contactEmail:
          type: string
          format: email
        originRegion:
          type: string
        active:
          type: boolean
    SupplierResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        contactEmail:
          type: string
        originRegion:
          type: string
        active:
          type: boolean
    ProductionLineRequest:
      type: object
      required:
      - code
      - name
      - capacityKgPerDay
      - active
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9-]{2,20}$
        name:
          type: string
        capacityKgPerDay:
          type: number
          minimum: 0.001
        active:
          type: boolean
    ProductionLineResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        capacityKgPerDay:
          type: number
        active:
          type: boolean
    MaterialRequest:
      type: object
      required:
      - lotCode
      - supplierId
      - materialName
      - openingStock
      properties:
        lotCode:
          type: string
        supplierId:
          type: string
          format: uuid
        materialName:
          type: string
        openingStock:
          $ref: '#/components/schemas/WeightInput'
        expiryDate:
          type: string
          format: date
          nullable: true
    MaterialUpdateRequest:
      type: object
      required:
      - lotCode
      - supplierId
      - materialName
      additionalProperties: false
      properties:
        lotCode:
          type: string
          maxLength: 100
        supplierId:
          type: string
          format: uuid
        materialName:
          type: string
          maxLength: 140
